name: Publish to npm

on:
  push:
    tags:
      - "@gentorial/*@*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (e.g. @gentorial/engine-vitepress)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Tags follow the changesets convention: "@gentorial/<pkg>@<version>".
      - name: Resolve package from tag
        if: github.event_name == 'push'
        id: target
        run: echo "name=${GITHUB_REF_NAME%@*}" >> "$GITHUB_OUTPUT"

      # Trusted publishing: npm derives a short-lived credential from the
      # GitHub OIDC token, so there is no NPM_TOKEN secret and no OTP prompt.
      - name: Publish tagged package
        if: github.event_name == 'push'
        run: >-
          pnpm --filter "${{ steps.target.outputs.name }}" publish
          --access public --no-git-checks

      - name: Publish a single package
        if: github.event_name == 'workflow_dispatch'
        run: >-
          pnpm --filter "${{ inputs.package }}" publish
          --access public --no-git-checks
